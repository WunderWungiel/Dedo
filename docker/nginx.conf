map $http_x_forwarded_proto $dedo_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

map $http_x_forwarded_for $dedo_forwarded_for {
    default $http_x_forwarded_for;
    "" $remote_addr;
}

resolver 127.0.0.11 valid=10s ipv6=off;
upstream dedo_app {
    zone dedo_app 64k;
    server app:8000 resolve;
}

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript
               application/xml text/xml image/svg+xml application/json;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $dedo_forwarded_proto;
    proxy_set_header X-Forwarded-For $dedo_forwarded_for;

    location / {
        proxy_pass http://dedo_app;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://dedo_app;
    }
}
