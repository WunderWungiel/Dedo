{% extends 'base.html' %}

{% block title %}Free mobile games{% endblock %}

{% block content %}
        <div class="ANDROID">Can't Find What You Want?</div>

        {% if random_game is not none %}
        <div style="margin-top: 1px; margin-bottom: -4px">
            <a href="{{ url_for('store.game_resolutions', id=random_game['id']) }}"><img src="{{ url_for('content', filename='images/banners/' ~ random_game['id'] ~ '.jpg') }}" width="100%" alt="banner" /></a>
        </div>
        {% endif %}

        <div class="GMENU">
            <img src="{{ url_for('static', filename='images/arrow-black.gif') }}" alt="." class="icon_img" /><a href="{{ url_for('store.search') }}" class="bluelink">Search Games</a>
        </div>
        <div class="GMENU">
            <img src="{{ url_for('static', filename='images/arrow-black.gif') }}" alt="." class="icon_img" /><a href="{{ url_for('store.browse_games') }}" class="bluelink">All games</a>
        </div>
        <!-- <div class="GMENU">
            <img src="{{ url_for('static', filename='images/arrow-black.gif') }}" alt="." class="icon_img" /><a href="{{ url_for('store.latest_games') }}" class="bluelink">Latest 15 Games</a>
        </div> -->
        <div class="GMENU">
            <img src="{{ url_for('static', filename='images/arrow-black.gif') }}" alt="." class="icon_img" /><a href="{{ url_for('store.top_games') }}" class="bluelink">TOP 50 Games</a>
        </div>
        <div class="GMENU">
            <img src="{{ url_for('static', filename='images/arrow-black.gif') }}" alt="." class="icon_img" /><a href="{{ url_for('store.vendors') }}" class="bluelink">Vendors</a>
        </div>
        <div class="GMENU">
            <img src="{{ url_for('static', filename='images/arrow-black.gif') }}" alt="." class="icon_img" /><a href="{{ url_for('store.games_resolutions') }}" class="bluelink">Resolutions</a>
        </div>
{% endblock %}
