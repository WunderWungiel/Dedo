services:
  app:
    image: dedo
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      TZ: ${TZ:-Etc/UTC}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      MONGO_HOST: db
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./config.yaml:/srv/config.yaml:ro
      - ./content:/srv/content:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      indexes:
        condition: service_completed_successfully
    stop_grace_period: 15s
    restart: unless-stopped

  indexes:
    image: dedo
    pull_policy: never
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["flask", "--app", "dedo.app", "create-indexes"]
    init: true
    environment:
      TZ: ${TZ:-Etc/UTC}
      MONGO_HOST: db
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./config.yaml:/srv/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  proxy:
    image: nginx:stable-alpine
    environment:
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mongo:9.0
    environment:
      TZ: ${TZ:-Etc/UTC}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The init process listens on loopback only. Ping the final, authenticated
      # server over the Compose network so an empty initialized catalogue is
      # ready as soon as MongoDB is.
      test: ["CMD-SHELL", "mongosh --host db --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" >/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 10
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  mongo_data:
